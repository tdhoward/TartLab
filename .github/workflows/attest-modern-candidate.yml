name: Attest modern qualification candidate

on:
  push:
    tags:
      - "modern-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Modern source tag to build for physical qualification
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modern-qualification
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.10 <3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/ide/www/package.json
          cache: npm
          cache-dependency-path: src/ide/www/package-lock.json

      - name: Bind qualification workflow identity
        run: >-
          python tools/check_modern_release_authenticity.py
          --qualification-tag "$RELEASE_TAG"

      - name: Install and build pinned inputs
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          npm ci --prefix src/ide/www
          npm run build --prefix src/ide/www

      - name: Set deterministic build identity
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build qualification candidate twice
        shell: bash
        run: |
          python makedist.py --output build/qualification/dist-one --clean --skip-web-build
          python makedist.py --output build/qualification/dist-two --clean --skip-web-build
          python tools/build_modern_release.py --dist build/qualification/dist-one --output build/qualification/release --version "$RELEASE_TAG" --clean
          python tools/build_modern_release.py --dist build/qualification/dist-two --output build/qualification/release-two --version "$RELEASE_TAG" --clean
          python tools/compare_releases.py build/qualification/release build/qualification/release-two

      - name: Enforce profile and firmware preflight
        shell: bash
        run: |
          python tools/check_modern_profile.py --dist build/qualification/dist-one --compare-dist build/qualification/dist-two
          python tools/check_modern_release.py --release build/qualification/release --dist build/qualification/dist-one --runtime-profile lvgl-modern --firmware-sha256 187a04dc9c74be161aa46d8b8f76ff64cb7eb4305b15c6d416e5fef471c7f2ab

      - name: Run qualification host matrix
        run: >-
          python -m unittest
          tests.test_phase1
          tests.test_phase2
          tests.test_phase4
          tests.test_phase5
          tests.test_modern_profile
          tests.test_phase6
          tests.test_phase6_provisioning
          tests.test_virtual_device
          tests.test_platform
          tests.test_headless_ide
          -v

      - name: Authenticate qualification candidate
        id: attest_candidate
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            build/qualification/release/*.tar
            build/qualification/release/*.json
            build/qualification/release/*.bin
            build/qualification/release/*.md

      - name: Preserve qualification attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_candidate.outputs.bundle-path }}
        shell: bash
        run: >-
          cp "$ATTESTATION_BUNDLE"
          build/qualification/release/qualification-attestation.sigstore.json

      - name: Upload authenticated candidate without publishing
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-modern-qualification-${{ github.sha }}
          path: build/qualification/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
