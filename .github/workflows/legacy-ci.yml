name: TartLab profile CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-mp123:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned MicroPython 1.23 source
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: a61c446c0b34e82aeb54b9770250d267656f2b7f
          path: build/micropython-v1.23.0
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.10 <3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/ide/www/package.json
          cache: npm
          cache-dependency-path: src/ide/www/package-lock.json

      - name: Install MicroPython Unix build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libffi-dev pkg-config

      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build web application from lockfile
        run: npm ci --prefix src/ide/www && npm run build --prefix src/ide/www

      - name: Set deterministic build identity
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=ci-${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - name: Verify vendored payload provenance
        run: python tools/vendor_lock.py

      - name: Verify tracked firmware artifacts
        run: python tools/check_firmware_artifacts.py

      - name: Test modern board catalog policy
        run: python -m unittest tests.test_board_catalog -v

      - name: Verify pinned modern firmware reference recipe
        run: python tools/modern_firmware.py check

      - name: Build historical base distributions twice from clean outputs
        shell: bash
        run: |
          python makedist.py --output build/base-one/dist --clean --skip-web-build
          python makedist.py --output build/base-two/dist --clean --skip-web-build

      - name: Verify historical PyDevices import and payload inventory
        run: python tools/pydevices_inventory.py --dist build/base-one/dist

      - name: Build pinned PyDevices migration candidate
        run: >-
          python tools/vendor_pydevices.py
          --fetch
          --output build/vendor/pydevices-candidate
          --clean

      - name: Probe PyDevices candidate compatibility surface
        run: >-
          python -B tests/pydevices_candidate_compat.py
          build/vendor/pydevices-candidate/runtime
          src/files/assets/test.qoi

      - name: Build pinned MicroPython 1.23 host tools
        shell: bash
        run: |
          make -C build/micropython-v1.23.0/mpy-cross -j2
          make -C build/micropython-v1.23.0/ports/unix submodules VARIANT=standard
          make -C build/micropython-v1.23.0/ports/unix -j2 VARIANT=standard

      - name: Build promoted vendor release twice
        shell: bash
        run: |
          python tools/build_promoted_release.py --base-dist build/base-one/dist --candidate build/vendor/pydevices-candidate --output build/one --version "$BUILD_VERSION" --mpy-cross build/micropython-v1.23.0/mpy-cross/build/mpy-cross --clean
          python tools/build_promoted_release.py --base-dist build/base-two/dist --candidate build/vendor/pydevices-candidate --output build/two --version "$BUILD_VERSION" --mpy-cross build/micropython-v1.23.0/mpy-cross/build/mpy-cross --clean

      - name: Run pinned MicroPython 1.23 compatibility tier
        run: >-
          python tools/run_micropython_compat.py
          --micropython build/micropython-v1.23.0/ports/unix/build-standard/micropython
          --mpy-cross build/micropython-v1.23.0/mpy-cross/build/mpy-cross
          --dist build/one/dist
          --candidate-runtime build/vendor/pydevices-candidate/runtime

      - name: Test Phase 1 state migration
        run: python -m unittest tests.test_phase1.StateTests -v

      - name: Test Phase 1 boot state
        run: python -m unittest tests.test_phase1.BootStateTests -v

      - name: Test Phase 1 default settings
        run: python -m unittest tests.test_phase1.DefaultSettingsTests -v

      - name: Test Phase 1 release ownership
        run: python -m unittest tests.test_phase1.ReleaseOwnershipTests -v

      - name: Test Phase 1 updater failures
        run: python -m unittest tests.test_phase1.UpdaterFailureTests -v

      - name: Test Phase 1 recovery updater
        run: python -m unittest tests.test_phase1.RecoveryUpdaterTests -v

      - name: Test Phase 1 boot recovery
        run: python -m unittest tests.test_phase1.BootRecoveryGateTests -v

      - name: Test Phase 1 fixture sanitization
        run: python -m unittest tests.test_phase1.FixtureTests.test_fixture_is_sanitized_and_release_approved -v

      - name: Test Phase 1 fixture update preservation
        run: python -m unittest tests.test_phase1.FixtureTests.test_legacy_fixture_survives_release_application_and_interruption -v

      - name: Run Phase 2 host tests
        run: python -m unittest tests.test_phase2 -v

      - name: Run Phase 4 vendor inventory and upstream mapping tests
        run: python -m unittest tests.test_phase4 -v

      - name: Run Phase 5 reference lock tests
        run: python -m unittest tests.test_phase5 -v

      - name: Validate Phase 6 release-authenticity policy
        run: |
          python tools/check_release_authenticity.py
          python tools/check_modern_release_authenticity.py

      - name: Run Phase 6 release-security tests
        run: >-
          python -m unittest
          tests.test_phase6
          tests.test_phase6_provisioning
          -v

      - name: Run virtual-device recovery tests
        run: python -m unittest tests.test_virtual_device -v

      - name: Run headless platform and startup tests
        run: python -m unittest tests.test_platform -v

      - name: Run full headless IDE initialization tests
        run: python -m unittest tests.test_headless_ide -v

      - name: Validate legacy release archive
        run: python tools/check_legacy_release.py --dist build/one/dist --release build/one/release

      - name: Compare independent release builds
        run: python tools/compare_releases.py build/one/release build/two/release

      - name: Check patch whitespace
        run: git diff --check

      - name: Publish reproducible candidate and provenance
        uses: actions/upload-artifact@v7
        with:
          name: legacy-mp123-${{ github.sha }}
          path: build/one/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  lvgl-modern-reference:
    name: LVGL modern promotion-gated candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.10 <3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/ide/www/package.json
          cache: npm
          cache-dependency-path: src/ide/www/package-lock.json

      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build web application from lockfile
        run: npm ci --prefix src/ide/www && npm run build --prefix src/ide/www

      - name: Set deterministic build identity
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == modern-v* ]]; then
            echo "MODERN_BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "MODERN_BUILD_VERSION=modern-v0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Verify modern reference and gated release policy
        run: |
          python tools/check_modern_profile.py
          python tools/check_modern_release_authenticity.py

      - name: Build modern filesystem twice from clean outputs
        shell: bash
        run: |
          python makedist.py --output build/modern-one/dist --clean --skip-web-build --board lilygo_t_display_s3_pro
          python makedist.py --output build/modern-two/dist --clean --skip-web-build --board lilygo_t_display_s3_pro

      - name: Verify deterministic modern filesystem and adapter inputs
        run: >-
          python tools/check_modern_profile.py
          --dist build/modern-one/dist
          --compare-dist build/modern-two/dist

      - name: Build isolated modern release candidates twice
        shell: bash
        run: |
          python tools/build_modern_release.py --dist build/modern-one/dist --output build/modern-one/release --version "$MODERN_BUILD_VERSION" --clean
          python tools/build_modern_release.py --dist build/modern-two/dist --output build/modern-two/release --version "$MODERN_BUILD_VERSION" --clean
          python tools/compare_releases.py build/modern-one/release build/modern-two/release

      - name: Validate modern release and provisioning preflight
        run: >-
          python tools/check_modern_release.py
          --release build/modern-one/release
          --dist build/modern-one/dist
          --runtime-profile lvgl-modern
          --board lilygo_t_display_s3_pro
          --firmware-sha256 187a04dc9c74be161aa46d8b8f76ff64cb7eb4305b15c6d416e5fef471c7f2ab

      - name: Run shared filesystem, recovery, platform, and modern-renderer tests
        run: >-
          python -m unittest
          tests.test_phase1
          tests.test_phase2
          tests.test_phase4
          tests.test_phase5
          tests.test_board_catalog
          tests.test_modern_profile
          tests.test_phase6
          tests.test_phase6_provisioning
          tests.test_virtual_device
          tests.test_platform
          tests.test_headless_ide
          -v

      - name: Check patch whitespace
        run: git diff --check

      - name: Publish promotion-gated modern candidate
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-modern-${{ github.sha }}
          path: build/modern-one/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
