name: Promote tested modern release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Modern source tag whose commit produced the tested candidate
        required: true
        type: string
      candidate_checksums_sha256:
        description: SHA-256 of the modern candidate checksums.json tested on hardware
        required: true
        type: string
      hardware_evidence_sha256:
        description: SHA-256 of the completed modern physical-test evidence bundle
        required: true
        type: string
      hardware_evidence_reference:
        description: Durable URL or artifact reference for the evidence bundle
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modern-release
    env:
      TARGET_REPOSITORY: "tdhoward/TartLab-modern-releases"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.10 <3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/ide/www/package.json
          cache: npm
          cache-dependency-path: src/ide/www/package-lock.json

      - name: Bind workflow identity and target feed
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python tools/check_modern_release_authenticity.py
          --promotion-tag "$RELEASE_TAG"

      - name: Install and build pinned inputs
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          npm ci --prefix src/ide/www
          npm run build --prefix src/ide/www

      - name: Rebuild the hardware-tested candidate twice
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python makedist.py --output build/promote-modern/dist-one --clean --skip-web-build
          python makedist.py --output build/promote-modern/dist-two --clean --skip-web-build
          python tools/build_modern_release.py --dist build/promote-modern/dist-one --output build/promote-modern/release --version "$RELEASE_TAG" --clean
          python tools/build_modern_release.py --dist build/promote-modern/dist-two --output build/promote-modern/release-two --version "$RELEASE_TAG" --clean
          python tools/compare_releases.py build/promote-modern/release build/promote-modern/release-two

      - name: Enforce runtime-profile and firmware preflight
        run: >-
          python tools/check_modern_release.py
          --release build/promote-modern/release
          --dist build/promote-modern/dist-one
          --runtime-profile lvgl-modern
          --firmware-sha256 187a04dc9c74be161aa46d8b8f76ff64cb7eb4305b15c6d416e5fef471c7f2ab

      - name: Bind physical evidence to the rebuilt modern release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_HASH: ${{ inputs.candidate_checksums_sha256 }}
          EVIDENCE_HASH: ${{ inputs.hardware_evidence_sha256 }}
          EVIDENCE_REFERENCE: ${{ inputs.hardware_evidence_reference }}
        run: >-
          python tools/create_modern_promotion_attestation.py
          --release build/promote-modern/release
          --tag "$RELEASE_TAG"
          --candidate-checksums-sha256 "$CANDIDATE_HASH"
          --hardware-evidence-sha256 "$EVIDENCE_HASH"
          --hardware-evidence-reference "$EVIDENCE_REFERENCE"
          --output build/promote-modern/release/promotion_attestation.json

      - name: Validate the complete authenticated subject set
        run: >-
          python tools/check_modern_release_authenticity.py
          --release build/promote-modern/release

      - name: Authenticate modern release assets with signed provenance
        id: attest_release
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            build/promote-modern/release/*.tar
            build/promote-modern/release/*.json
            build/promote-modern/release/*.bin
            build/promote-modern/release/*.md

      - name: Preserve the signed attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_release.outputs.bundle-path }}
        shell: bash
        run: >-
          cp "$ATTESTATION_BUNDLE"
          build/promote-modern/release/release-attestation.sigstore.json

      - name: Publish only to the isolated modern repository
        env:
          GH_TOKEN: ${{ secrets.MODERN_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          build/promote-modern/release/*.tar
          build/promote-modern/release/*.json
          build/promote-modern/release/*.bin
          build/promote-modern/release/*.md
          --repo "$TARGET_REPOSITORY"
          --target main
          --title "TartLab modern $RELEASE_TAG"
          --notes "lvgl-modern release; exact firmware and physical-gate evidence are declared in authenticated metadata"
