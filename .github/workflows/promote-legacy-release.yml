name: Promote tested legacy release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag whose commit produced the tested candidate
        required: true
        type: string
      candidate_checksums_sha256:
        description: SHA-256 of the candidate checksums.json tested on hardware
        required: true
        type: string
      hardware_evidence_sha256:
        description: SHA-256 of the completed physical-test evidence bundle
        required: true
        type: string
      hardware_evidence_reference:
        description: Durable URL or artifact reference for the evidence bundle
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: legacy-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned MicroPython 1.23 source
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: a61c446c0b34e82aeb54b9770250d267656f2b7f
          path: build/micropython-v1.23.0
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.10 <3.15"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: src/ide/www/package.json
          cache: npm
          cache-dependency-path: src/ide/www/package-lock.json

      - name: Bind workflow identity to the requested stable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python tools/check_release_authenticity.py
          --promotion-tag "$RELEASE_TAG"

      - name: Install and build pinned inputs
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          npm ci --prefix src/ide/www
          npm run build --prefix src/ide/www
          make -C build/micropython-v1.23.0/mpy-cross -j2

      - name: Build pinned promoted PyDevices source
        run: >-
          python tools/vendor_pydevices.py
          --fetch
          --output build/vendor/pydevices-candidate
          --clean

      - name: Rebuild the hardware-tested candidate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          python makedist.py --output build/promote-base/dist --clean --skip-web-build
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python tools/build_promoted_release.py --base-dist build/promote-base/dist --candidate build/vendor/pydevices-candidate --output build/promote --version "$RELEASE_TAG" --mpy-cross build/micropython-v1.23.0/mpy-cross/build/mpy-cross --clean
          python tools/check_legacy_release.py --dist build/promote/dist --release build/promote/release

      - name: Bind physical evidence to the rebuilt release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_HASH: ${{ inputs.candidate_checksums_sha256 }}
          EVIDENCE_HASH: ${{ inputs.hardware_evidence_sha256 }}
          EVIDENCE_REFERENCE: ${{ inputs.hardware_evidence_reference }}
        run: >-
          python tools/create_promotion_attestation.py
          --release build/promote/release
          --tag "$RELEASE_TAG"
          --candidate-checksums-sha256 "$CANDIDATE_HASH"
          --hardware-evidence-sha256 "$EVIDENCE_HASH"
          --hardware-evidence-reference "$EVIDENCE_REFERENCE"
          --output build/promote/release/promotion_attestation.json

      - name: Authenticate release assets with signed build provenance
        id: attest_release
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            build/promote/release/*.tar
            build/promote/release/*.json

      - name: Preserve the signed attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_release.outputs.bundle-path }}
        shell: bash
        run: >-
          cp "$ATTESTATION_BUNDLE"
          build/promote/release/release-attestation.sigstore.json

      - name: Publish stable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG"
          build/promote/release/*.tar
          build/promote/release/*.json
          --verify-tag
          --title "TartLab $RELEASE_TAG"
          --notes "legacy-mp123 release; physical-gate evidence is recorded in promotion_attestation.json"
